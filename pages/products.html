<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../BhCelular-project/styles/products.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <div id="header-container"></div>

    <script>
        fetch("./header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
                const script = document.createElement("script");
                script.src = "../js/header.js";
                document.body.appendChild(script);
            });
    </script>

    <h1 id="tittle">Produtos</h1>
    <p id="subTittle">Confira nossa seleção de smartphones, acessórios e serviços com garantia e procedência.</p>




    <aside class="sidebar">

        <div class="products-container">

            <aside class="sidebar">
                <div class="category-list">
                    <button class="category-btn active" data-category="all">Todos</button>
                    <button class="category-btn" data-category="smartphones">Smartphones</button>
                    <button class="category-btn" data-category="accessories">Acessórios</button>
                    <button class="category-btn" data-category="assistance">Assistência</button>
                </div>

                <div class="price-filter">
                    <h3>Faixa de preço</h3>
                    <input type="range" id="price-range" min="0" max="10000" step="100" value="10000">
                    <div class="price-values">
                        <span>R$ 0</span>
                        <span id="price-display">R$ 10.000</span>
                    </div>
                </div>
            </aside>

            <main class="product-content" id="product-list">
            </main>

        </div>

        <script src="../BhCelular-project/js/products.js"></script>
</body>

</html>
