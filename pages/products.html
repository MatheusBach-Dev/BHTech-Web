<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/products.css">
    <link rel="stylesheet" href="/styles/header.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <div id="header-container"></div>

    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
                const script = document.createElement("script");
                script.src = "../js/header.js";
                document.body.appendChild(script);
            });
    </script>

    <section id="banner">
        <h1>Produtos</h1>
        <p>Confira nossa seleção de smartphones, acessórios e serviços com garantia e procedência.</p>
    </section>

    <div class="main-container">

        <aside class="sidebar">
            <div class="category-list">
                <button class="category-btn active" data-category="all">Todos</button>
                <button class="category-btn" data-category="smartphones">Smartphones</button>
                <button class="category-btn" data-category="accessories">Acessórios</button>
            </div>

            <div class="price-filter">
                <h3>Faixa de preço</h3>
                <input type="range" id="price-range" min="0" max="10000" step="100" value="10000">
                <div class="price-values">
                    <span>R$ 0</span>
                    <span id="price-display">R$ 10.000</span>
                </div>
            </div>
        </aside>

        <main class="product-content">
            <div id="product-list" class="product-grid"></div>

            <div class="pagination" id="pagination">
                <div class="pagination-numbers" id="pagination-numbers"></div>
                <div class="pagination-arrow" id="pagination-arrow">
                    <span class="arrow-next" id="arrow-next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </div>
            </div>
        </main>

    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="modal-image"></div>
            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <div id="modal-price" class="product-price"></div>
                <a id="modal-buy-btn" class="buy-btn" target="_blank">Comprar</a>
            </div>
        </div>
    </div>

    <script src="/js/products.js"></script>
</body>

</html>
